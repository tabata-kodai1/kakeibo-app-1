<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家計簿 — 収支入力モーダル（S-02）モックアップ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<p class="mock-note">
  モックアップ: <strong>S-02 収支入力モーダル</strong>（<a href="../screens.md">screens.md</a>）。
  背後はダッシュボード（<a href="index.html">index.html</a>）。金額欄はバリデーションエラーの表示例です。
  予算設定モーダルは <a href="budget-modal.html">budget-modal.html</a>。
</p>

<div class="app">
  <div class="header">
    <h1>家計簿</h1>
  </div>

  <div class="month-nav">
    <button>◀ 前月</button>
    <span class="current">2026年9月</span>
    <button>翌月 ▶</button>
  </div>

  <div class="card summary">
    <div class="summary-head">
      <div class="item">
        <div class="label">予算</div>
        <div class="value">80,000</div>
      </div>
      <div class="item">
        <div class="label">使用</div>
        <div class="value">52,300</div>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-sm">予算を設定</button>
    </div>

    <div class="progress">
      <div class="fill" style="width: 65%"></div>
    </div>
    <div class="progress-label">65% 使用</div>

    <div class="remaining">
      <div class="label">残り</div>
      <div class="value">27,700<span class="unit">円</span></div>
    </div>
  </div>

  <div class="list-head">
    <span class="count">明細 6件</span>
    <span class="actions">
      <button class="btn btn-primary btn-sm">＋ 追加</button>
      <button class="btn btn-sm">選択</button>
    </span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-date">日付</th>
          <th class="col-category">カテゴリ</th>
          <th class="col-amount">金額</th>
          <th>メモ</th>
          <th class="col-actions">操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>09/25</td>
          <td>食費</td>
          <td class="col-amount"><span class="amount expense">-1,280</span></td>
          <td class="memo">スーパーで買い物</td>
          <td class="col-actions">
            <button class="btn-icon">✎</button>
            <button class="btn-icon">🗑</button>
          </td>
        </tr>
        <tr>
          <td>09/25</td>
          <td>給与</td>
          <td class="col-amount"><span class="amount income">+250,000</span></td>
          <td class="memo">9月分</td>
          <td class="col-actions">
            <button class="btn-icon">✎</button>
            <button class="btn-icon">🗑</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- S-02 収支入力モーダル -->
<div class="overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>収支を追加</h2>
      <button class="btn-icon" title="閉じる">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>日付<span class="required">必須</span></label>
        <input type="date" value="2026-09-25">
      </div>
      <div class="field">
        <label>カテゴリ<span class="required">必須</span></label>
        <select>
          <option value="">選択してください</option>
          <optgroup label="支出">
            <option selected>食費</option>
            <option>日用品</option>
            <option>交通費</option>
            <option>住居費</option>
            <option>水道光熱費</option>
            <option>通信費</option>
            <option>娯楽費</option>
            <option>医療費</option>
            <option>その他</option>
          </optgroup>
          <optgroup label="収入">
            <option>給与</option>
            <option>賞与</option>
            <option>副収入</option>
            <option>その他収入</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <label>金額<span class="required">必須</span></label>
        <input type="number" class="invalid" value="0">
        <span class="field-error">金額は1以上の整数で入力してください</span>
      </div>
      <div class="field">
        <label>メモ</label>
        <input type="text" placeholder="任意・200文字以内">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn">キャンセル</button>
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

</body>
</html>
